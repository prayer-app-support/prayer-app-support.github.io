<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Prayer Cards</title>
    <style>
      :root {
        color: #24251f;
        background: #f7f5f1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: min(680px, calc(100% - 40px)); margin: 0 auto; padding: 96px 0; }
      .mark { color: #5e725e; font-size: 2.2rem; }
      h1 { margin: 18px 0 12px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.5rem, 8vw, 4rem); line-height: 1.06; }
      p { color: #5f6058; font-size: 1.05rem; line-height: 1.65; }
      .card { margin-top: 32px; padding: 24px; border: 1px solid #e5e1da; border-radius: 20px; background: #fffefc; }
      a { color: #365b50; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">◌</div>
      <h1>Prayer Cards</h1>
      <p>
        This domain connects Prayer’s NFC cards to the Prayer iPhone app.
        When Prayer is installed, a supported card opens directly in the app.
      </p>
      <div class="card">
        <p>
          If Prayer did not open, install or update the app and scan the card again.
          For help, visit <a href="https://prayer-app-support.github.io/prayer-support/support.html">Prayer Support</a>.
        </p>
      </div>
    </main>
  </body>
</html>
